name: CI

on:
  push:
    branches: [main, develop, "release/**"]
    paths-ignore:
      - "docs/**"
      - "screenshots/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "screenshots/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Linux quality and web check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Bevy's audio, input and windowing on Linux.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p game
      # The balance bot's table, kept in game/tests/balance.txt.
      - run: cargo test -p game balance -- --ignored
      # The browser build: the save goes through localStorage there.
      - name: Cache wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}-${{ runner.arch }}
      - name: Install wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: ./scripts/build-web.sh
      - run: python3 scripts/check-web-package.py website/play

  native:
    name: Native build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo build --release -p game
