[workspace]
resolver = "2"
members = ["game"]

[workspace.dependencies]
bevy = "0.20"

# Profiles only take effect at the workspace root
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
# Function names alone weigh ~55 MB in the browser build.
strip = true
