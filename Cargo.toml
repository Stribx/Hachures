[workspace]
resolver = "2"
members = ["game"]

[workspace.dependencies]
# Bevy's 3d, ui and audio profiles: the default set without 2d, whose sprites the game never draws.
bevy = { version = "0.20", default-features = false, features = ["3d", "ui", "audio"] }

# Profiles only take effect at the workspace root
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
# Function names alone weigh ~55 MB in the browser build.
strip = true
