[package]
name = "game"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "Hachures"   # -> produces Hachures.exe
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# The save lives in localStorage in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[features]
# Fast incremental builds while developing: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]
